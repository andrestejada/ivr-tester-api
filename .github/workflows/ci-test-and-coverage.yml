name: Test and Coverage

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      APP_PORT: '8000'
      BASE_URL: http://localhost:8000
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_JWT_SECRET: test-jwt-secret
      TWILIO_ACCOUNT_SID: ACtestsid
      TWILIO_AUTH_TOKEN: test-token
      TWILIO_PHONE_NUMBER: '+10000000000'
      DEEPGRAM_API_KEY: test-deepgram-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run pytest tests/ -v --cov=src/application/use_cases --cov=src/application/services --cov=src/application/utils --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov | tee pytest-output.txt
          EXIT_CODE=$?
          echo "Test exit code: $EXIT_CODE"

      - name: Collect metrics
        id: metrics
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          
          output_file = os.environ["GITHUB_OUTPUT"]
          files_table_path = "coverage-files-table.md"
          
          def write_outputs(values: dict[str, str]) -> None:
            with open(output_file, "a", encoding="utf-8") as f:
              for k, v in values.items():
                f.write(f"{k}={v}\n")
          
          try:
            root = ET.parse("coverage.xml").getroot()
          except Exception:
            write_outputs({
              "coverage": "N/A",
              "covered_lines": "N/A",
              "missed_lines": "N/A",
              "measurable_lines": "N/A",
              "files_count": "0",
            })
            with open(files_table_path, "w", encoding="utf-8") as f:
              f.write("### Coverage by File\n\n")
              f.write("Coverage details are unavailable because coverage.xml could not be parsed.\n")
          else:
            files: dict[str, dict[str, int]] = {}
          
            for class_node in root.findall(".//class"):
              filename = class_node.attrib.get("filename", "").strip()
              if not filename:
                continue
          
              line_nodes = class_node.findall("./lines/line")
              measurable = len(line_nodes)
              covered = sum(1 for ln in line_nodes if int(ln.attrib.get("hits", "0")) > 0)
          
              entry = files.setdefault(
                filename,
                {"covered": 0, "measurable": 0},
              )
              entry["covered"] += covered
              entry["measurable"] += measurable
          
            lines_covered = int(root.attrib.get("lines-covered", "0"))
            lines_valid = int(root.attrib.get("lines-valid", "0"))
          
            # Fallback for environments where root attrs are not populated.
            if lines_valid == 0:
              lines_valid = sum(item["measurable"] for item in files.values())
              lines_covered = sum(item["covered"] for item in files.values())
          
            line_rate = (lines_covered / lines_valid * 100.0) if lines_valid else 0.0
            missed = max(lines_valid - lines_covered, 0)
          
            rows = []
            for filename, item in files.items():
              measurable = item["measurable"]
              covered = item["covered"]
              missed_lines = max(measurable - covered, 0)
              pct = (covered / measurable * 100.0) if measurable else 0.0
              rows.append((pct, filename, covered, missed_lines, measurable))
          
            rows.sort(key=lambda r: (r[0], r[1]))
          
            with open(files_table_path, "w", encoding="utf-8") as f:
              f.write("### Coverage by File\n\n")
              f.write("| File | Coverage | Covered | Missed | Measurable |\n")
              f.write("| --- | ---: | ---: | ---: | ---: |\n")
              for pct, filename, covered, missed_lines, measurable in rows:
                f.write(
                  f"| {filename} | {pct:.2f}% | {covered} | {missed_lines} | {measurable} |\n"
                )
          
            write_outputs(
              {
                "coverage": f"{line_rate:.2f}%",
                "covered_lines": str(lines_covered),
                "missed_lines": str(missed),
                "measurable_lines": str(lines_valid),
                "files_count": str(len(rows)),
              }
            )
          PY

          echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
            pytest-output.txt
            coverage-files-table.md
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test and Coverage Summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ steps.metrics.outputs.result }} |"
            echo "| Coverage (business logic lines) | ${{ steps.metrics.outputs.coverage }} |"
            echo "| Covered lines | ${{ steps.metrics.outputs.covered_lines }} |"
            echo "| Missed lines | ${{ steps.metrics.outputs.missed_lines }} |"
            echo "| Measurable lines | ${{ steps.metrics.outputs.measurable_lines }} |"
            echo "| Files measured | ${{ steps.metrics.outputs.files_count }} |"
            echo "| Artifact | coverage-report |"
            echo ""
            echo "Use the artifact **coverage-report** to inspect the full HTML coverage report."
            echo ""
            if [ -f coverage-files-table.md ]; then
              cat coverage-files-table.md
            else
              echo "Coverage by file table is unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
