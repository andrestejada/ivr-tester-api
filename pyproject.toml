[project]
name = "ivr-tester-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=41.0.0",
    "deepgram-sdk>=3.0.0",
    "fastapi[standard]>=0.134.0",
    "httpx>=0.25.0",
    "matplotlib>=3.10.6",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.8.0",
    "reportlab>=4.4.4",
    "sqlalchemy>=2.0.47",
    "tenacity>=8.2.3",
    "twilio>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest>=8.0.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
markers = ["asyncio", "integration", "unit"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.coverage.run]
source = [
    "src/application/use_cases",
    "src/application/services",
    "src/application/utils",
]
branch = false
omit = [
    "src/application/dtos/*",
    "src/presentation/*",
    "src/domain/entities/*",
    "src/infrastructure/database/*",
    "src/infrastructure/auth/*",
    "src/infrastructure/providers/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.isort]
known-first-party = ["src"]
